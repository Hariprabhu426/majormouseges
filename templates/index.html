<!DOCTYPE html>
<html>
<head>
    <title>Gesture Mouse Pro</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<!-- 🔥 INTRO SCREEN -->
<div id="intro">

    <div class="intro-content">

        <!-- 🖱️ MOUSE LOGO -->
        <svg class="mouse-logo" viewBox="0 0 200 300">

            <!-- Mouse Body -->
            <rect x="60" y="20" width="80" height="200" rx="40" class="mouse-body"/>

            <!-- Scroll Wheel -->
            <rect x="95" y="40" width="10" height="30" rx="5" class="wheel"/>

            <!-- Divider -->
            <line x1="100" y1="80" x2="100" y2="140" class="divider"/>

        </svg>

        <h1 class="intro-text">GestureMouse</h1>
        <p class="tagline">Control Without Touch</p>

    </div>

</div>


<!-- 🔥 MAIN APPLICATION -->
<div id="app" style ="display: none;">

    <!-- 🔥 NAVBAR -->
    <div class="navbar">
        <div class = "left">
            <h2 class="brand">💞 𝙂𝙚𝙨𝙩𝙪𝙧𝙚 𝙈𝙤𝙪𝙨𝙚</h2>

        </div>
        <span id="status" class="status stopped">● Stopped</span>
    </div>
     <div class="Right">
            <h3>“Just move. It follows...💞”</h3>
        </div>
        

    <!-- 🔥 DASHBOARD -->
    <div class="dashboard">

        <!-- 🎥 CAMERA -->
        <div class="camera-card">
            <h3>Live Tracking</h3>
            <video id="video" autoplay playsinline></video>
        </div>

        <!-- 📊 PANEL -->
        <div class="panel">

            <div class="card">
                <h3>Control</h3>
                <button id="startBtn">Start</button>
                <button id="stopBtn">Stop</button>
            </div>

            <div class="card">
                <h3>Gestures</h3>
                <p>Move → Cursor</p>
                <p>Pinch → Click</p>
                <p>Two Fingers → Right Click</p>
                <p>Open Hand → Scroll</p>
            </div>

            <div class="card">
                <h3>Status</h3>
                <p>Camera: Active</p>
                <p>Tracking: Ready</p>
            </div>

        </div>

    </div>

</div>

<!-- MediaPipe -->
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4/hands.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>

<script src="/static/script.js"></script>


</body>
</html>
